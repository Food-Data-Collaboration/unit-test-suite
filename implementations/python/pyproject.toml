[project]
name = "dfc-interop-test-runner"
version = "1.0.0"
description = "Python implementation of DFC and JSON-LD interoperability tests"
requires-python = ">=3.9"
dependencies = [
    "pyld>=3.0.0",
    "rdflib>=6.0.0",
    "pytest>=7.0.0",
    "pytest-junitxml>=1.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[project.scripts]
dfc-test-runner = "dfc_test_runner.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit2"
